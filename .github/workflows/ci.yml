name: smoke-test

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m py_compile audit.py
      - run: python3 audit.py https://example.com --pages 2 --out /tmp/ci-out
      - run: test -f /tmp/ci-out/*/report.json && test -f /tmp/ci-out/*/CLIENT-REPORT.md && test -f /tmp/ci-out/*/TECHNICAL-REPORT.md
